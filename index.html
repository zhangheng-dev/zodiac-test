<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的生肖是什么</title>
<style>
  :root {
    --celadon: #dce8e1;
    --paper: #f7faf8;
    --ink: #1f3a34;
    --moss: #5c7a70;
    --cinnabar: #c8372d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--celadon);
    color: var(--ink);
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    display: flex;
    justify-content: center;
    padding: 32px 20px 48px;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 28px; letter-spacing: 2px; margin-bottom: 8px; }
  .sub { color: var(--moss); font-size: 15px; margin-bottom: 28px; line-height: 1.6; }
  .panel { background: var(--paper); border-radius: 6px; padding: 22px 20px; }
  label { display: block; font-size: 15px; margin-bottom: 8px; }
  input[type="number"] {
    width: 100%;
    font: inherit;
    font-size: 22px;
    padding: 12px 14px;
    border: 1.5px solid var(--moss);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  input[type="number"]:focus-visible,
  button:focus-visible,
  input[type="checkbox"]:focus-visible { outline: 3px solid var(--cinnabar); outline-offset: 2px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0 20px; font-size: 14px; color: var(--moss); line-height: 1.5; }
  .check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--cinnabar); }
  button {
    width: 100%;
    font: inherit;
    font-size: 18px;
    letter-spacing: 4px;
    padding: 13px;
    border: none;
    border-radius: 4px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }
  button:active { background: #2c5249; }
  .error { color: var(--cinnabar); font-size: 14px; margin-top: 12px; min-height: 1.2em; }
  #result { margin-top: 28px; display: none; text-align: center; }
  #result.show { display: block; }
  .seal {
    width: 132px; height: 132px;
    margin: 0 auto 22px;
    border: 5px solid var(--cinnabar);
    border-radius: 8px;
    color: var(--cinnabar);
    display: flex; align-items: center; justify-content: center;
    font-size: 84px; font-weight: 700;
    transform: rotate(-4deg);
    background: rgba(200, 55, 45, 0.06);
  }
  #result.show .seal { animation: stamp 0.45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes stamp {
    from { transform: rotate(-4deg) scale(1.7); opacity: 0; }
    to   { transform: rotate(-4deg) scale(1); opacity: 1; }
  }
  .year-line { color: var(--moss); font-size: 15px; margin-bottom: 6px; }
  .title { font-size: 24px; margin-bottom: 12px; }
  .desc { font-size: 16px; line-height: 1.85; text-align: left; background: var(--paper); border-radius: 6px; padding: 18px; }
  .foot { margin-top: 28px; font-size: 12px; color: var(--moss); text-align: center; line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) { #result.show .seal { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>你的生肖是什么</h1>
  <p class="sub">输入出生年份，印章会告诉你答案。</p>

  <div class="panel">
    <label for="year">出生年份（公历）</label>
    <input id="year" type="number" inputmode="numeric" placeholder="例如 2006" min="1900" max="2100">
    <div class="check">
      <input id="beforeCNY" type="checkbox">
      <span>我出生在 1 月或 2 月初，且在当年春节之前</span>
    </div>
    <button id="go" type="button">查看生肖</button>
    <p class="error" id="err" role="alert"></p>
  </div>

  <section id="result" aria-live="polite">
    <div class="seal" id="seal"></div>
    <p class="year-line" id="yearLine"></p>
    <h2 class="title" id="title"></h2>
    <p class="desc" id="desc"></p>
  </section>

  <p class="foot">生肖按农历春节换年，不是 1 月 1 日。<br>内容仅供娱乐。</p>
</main>

<script>
  const ZODIAC = [
    { c: "鼠", n: "属鼠", d: "机灵，反应快，擅长在细节里发现机会。你习惯先观察再行动，朋友遇到难题时常会来找你出主意。" },
    { c: "牛", n: "属牛", d: "踏实，耐力强，认定的事就会一步步做完。你话不多，但答应过的事一定兑现，是让人安心的那种人。" },
    { c: "虎", n: "属虎", d: "勇敢，有主见，遇事不爱绕弯。你身上有天然的号召力，只是偶尔需要学会放慢一点，听听别人的想法。" },
    { c: "兔", n: "属兔", d: "温和，细腻，审美在线。你擅长体察别人的情绪，相处起来舒服，也很懂得在忙碌中给自己留出安静的角落。" },
    { c: "龙", n: "属龙", d: "有想法，也有行动力，天生带着一点舞台感。你不满足于平淡，总想把事情做得与众不同。" },
    { c: "蛇", n: "属蛇", d: "沉静，思考深，直觉敏锐。你不轻易表态，但一旦下判断往往很准，适合做需要专注和策略的事。" },
    { c: "马", n: "属马", d: "热情，自由，充满行动力。你喜欢新鲜的地方和新鲜的挑战，待在原地太久会让你觉得闷。" },
    { c: "羊", n: "属羊", d: "善良，有同理心，富有创造力。你重视身边的人，也有自己的小世界，在安静的环境里最能发挥才华。" },
    { c: "猴", n: "属猴", d: "聪明，好奇，点子多。你学东西很快，遇到问题总能换个角度解决，气氛也常常因为你变得轻松。" },
    { c: "鸡", n: "属鸡", d: "认真，守时，做事有条理。你对自己要求高，计划做得清楚，是团队里最可靠的执行者。" },
    { c: "狗", n: "属狗", d: "忠诚，正直，重感情。你护着自己在乎的人，看到不公平的事会站出来，朋友不多但都是真心的。" },
    { c: "猪", n: "属猪", d: "随和，大方，懂得享受生活。你对人真诚，不爱算计，福气也往往来自你身边积累的好人缘。" }
  ];

  const yearEl = document.getElementById("year");
  const cnyEl = document.getElementById("beforeCNY");
  const errEl = document.getElementById("err");
  const resultEl = document.getElementById("result");

  function show() {
    errEl.textContent = "";
    const raw = parseInt(yearEl.value, 10);
    if (!raw || raw < 1900 || raw > 2100) {
      resultEl.classList.remove("show");
      errEl.textContent = "请输入 1900 到 2100 之间的四位年份。";
      return;
    }
    const lunarYear = cnyEl.checked ? raw - 1 : raw;
    const idx = (((lunarYear - 4) % 12) + 12) % 12;
    const z = ZODIAC[idx];

    document.getElementById("seal").textContent = z.c;
    document.getElementById("yearLine").textContent =
      cnyEl.checked ? raw + " 年春节前出生，按 " + lunarYear + " 年计算" : raw + " 年出生";
    document.getElementById("title").textContent = "你" + z.n;
    document.getElementById("desc").textContent = z.d;

    resultEl.classList.remove("show");
    void resultEl.offsetWidth;
    resultEl.classList.add("show");
    resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  document.getElementById("go").addEventListener("click", show);
  yearEl.addEventListener("keydown", e => { if (e.key === "Enter") show(); });
</script>
</body>
</html>
